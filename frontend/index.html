<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Analitica Adaptativa Multidominio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for TSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset('custom-react', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-canvas: #0A0A0B;
      --bg-surface: #121214;
      --bg-surface-elevated: #18181B;
      --bg-card: rgba(255, 255, 255, 0.035);
      --bg-card-hover: rgba(255, 255, 255, 0.055);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.14);
      --accent-blue: #2997FF;
      --accent-blue-hover: #1A85FF;
      --accent-glow: rgba(41, 151, 255, 0.25);
      --text-primary: #F5F5F7;
      --text-secondary: #A1A1A6;
      --text-tertiary: #6E6E73;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .glass-surface {
      background: rgba(18, 18, 20, 0.72);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .glass-modal {
      background: rgba(22, 22, 24, 0.92);
      backdrop-filter: blur(32px) saturate(150%);
      -webkit-backdrop-filter: blur(32px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 64px -8px rgba(0, 0, 0, 0.85);
    }

    .pill-accent {
      background: rgba(41, 151, 255, 0.12);
      color: #2997FF;
      border: 1px solid rgba(41, 151, 255, 0.28);
    }
    .pill-success {
      background: rgba(50, 215, 75, 0.12);
      color: #32D74B;
      border: 1px solid rgba(50, 215, 75, 0.28);
    }
    .pill-warning {
      background: rgba(255, 159, 10, 0.12);
      color: #FF9F0A;
      border: 1px solid rgba(255, 159, 10, 0.28);
    }
    .pill-neutral {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-apple-primary {
      background: var(--accent-blue);
      color: #FFFFFF;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(41, 151, 255, 0.3);
    }
    .btn-apple-primary:hover:not(:disabled) {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(41, 151, 255, 0.4);
    }
    .btn-apple-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-apple-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-apple-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .btn-apple-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-apple {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .input-apple:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-apple::placeholder {
      color: var(--text-tertiary);
    }
  </style>
</head>
<body class="bg-[#0A0A0B] text-[#F5F5F7] min-h-screen flex antialiased selection:bg-[#2997FF]/30 selection:text-[#FFFFFF]">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel" data-presets="custom-react">
    const { useState, useEffect, useRef } = React;

    // --- Monochromatic SVG Icons (1.5px stroke, No Emojis) ---

    const IconLayers = () => (

    const IconAlert = () => (

        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>

    const IconRefresh = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
      </svg>
    );

    const IconChevronDown = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    );

    const IconChevronRight = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    );

    // --- Dynamic Dark Mode Charts (Apple macOS) ---
    function DynamicCharts({ charts, activeFilters, onSelectFilter }) {
      const chartRefs = useRef([]);

      useEffect(() => {
        if (!charts || charts.length === 0) return;
        const instances = [];

        charts.forEach((chart, idx) => {
          const canvas = chartRefs.current[idx];
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const dataRows = chart.data || [];
          if (dataRows.length === 0) return;

          const firstRow = dataRows[0];
          const labelKey = Object.keys(firstRow).find(k => typeof firstRow[k] === 'string') || Object.keys(firstRow)[0];
          const numericKey = Object.keys(firstRow).find(k => typeof firstRow[k] === 'number') || Object.keys(firstRow)[1];

          const labels = dataRows.map(r => String(r[labelKey] || 'N/A'));
          const values = dataRows.map(r => Number(r[numericKey] || 0));

          const isTrend = chart.chart_type === 'time_series' || labels.some(l => l.includes('2024') || l.includes('2025') || l.includes('2026'));

          const instance = new Chart(ctx, {
            type: isTrend ? 'line' : 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: (chart.metric || numericKey || 'Métrica').replace('_', ' ').toUpperCase(),
                data: values,
                backgroundColor: isTrend
                  ? 'rgba(41, 151, 255, 0.12)'
                  : values.map(v => v < 0 ? 'rgba(255, 69, 58, 0.65)' : 'rgba(41, 151, 255, 0.65)'),
                borderColor: isTrend ? '#2997FF' : values.map(v => v < 0 ? '#FF453A' : '#2997FF'),
                borderWidth: isTrend ? 2 : 1,
                fill: isTrend,
                tension: 0.35,
                borderRadius: isTrend ? 0 : 8,
                pointBackgroundColor: '#2997FF',
                pointBorderColor: '#0A0A0B',
                pointBorderWidth: 2,
                pointRadius: isTrend ? 4 : 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              onClick: (e, elements) => {
                if (elements.length > 0 && onSelectFilter) {
                  const clickedIdx = elements[0].index;
                  const val = labels[clickedIdx];
                  onSelectFilter(labelKey, val);
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(22, 22, 24, 0.95)',
                  titleColor: '#F5F5F7',
                  bodyColor: '#A1A1A6',
                  borderColor: 'rgba(255, 255, 255, 0.15)',
                  borderWidth: 1,
                  padding: 10,
                  cornerRadius: 10,
                  callbacks: {
                    label: (c) => `${c.dataset.label}: ${c.parsed.y >= 0 ? '$' : '-$'}${Math.abs(c.parsed.y).toLocaleString()}`
                  }
                }
              },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#6E6E73', font: { size: 11 } } },
                y: {
                  grid: { color: 'rgba(255, 255, 255, 0.04)' },
                  ticks: {
                    color: '#6E6E73',
                    font: { size: 11 },
                    callback: (v) => (v < 0 ? '-$' : '$') + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(0) + 'k' : Math.abs(v))
                  }
                }
              }
            }
          });
          instances.push(instance);
        });

        return () => {
          instances.forEach(i => i.destroy());
        };
      }, [charts]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {charts.map((chart, idx) => (
            <div key={chart.id || idx} className="glass-card p-6 flex flex-col justify-between">
              <div>
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <h4 className="text-sm font-semibold tracking-tight text-[#F5F5F7]">{chart.title}</h4>
                    <p className="text-xs text-[#8E8E93] mt-0.5">{chart.question_answered}</p>
                  </div>
                  {chart.is_primary_objective && (
                    <span className="pill-accent text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full">
                      Objetivo Primario
                    </span>
                  )}
                </div>
                <div className="h-56 w-full relative mb-5">
                  <canvas ref={el => chartRefs.current[idx] = el}></canvas>
                </div>
              </div>

              {/* Data Table with Export */}
              <div className="overflow-x-auto border-t border-[rgba(255,255,255,0.06)] pt-4">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-[10px] font-semibold text-[#6E6E73] uppercase tracking-wider">
                    Datos Subyacentes
                  </span>
                  <button
                    onClick={() => {
                      const csvContent = "data:text/csv;charset=utf-8," + 
                        [Object.keys(chart.data[0] || {}).join(",")].concat(
                          chart.data.map(r => Object.values(r).join(","))
                        ).join("\n");
                      const encodedUri = encodeURI(csvContent);
                      const link = document.createElement("a");
                      link.setAttribute("href", encodedUri);
                      link.setAttribute("download", `${chart.id || "datos"}.csv`);
                      document.body.appendChild(link);
                      link.click();
                      document.body.removeChild(link);
                    }}
                    className="text-[11px] text-[#2997FF] hover:underline flex items-center space-x-1"
                  >
                    <IconDownload />
                    <span>Descargar CSV</span>
                  </button>
                </div>

                <table className="w-full text-xs text-left">
                  <thead>
                    <tr className="text-[#6E6E73] uppercase tracking-wider text-[10px] border-b border-[rgba(255,255,255,0.06)]">
                      {Object.keys(chart.data[0] || {}).map(k => (
                        <th key={k} className="py-2 px-3 font-medium">{k.replace('_', ' ')}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[rgba(255,255,255,0.04)] text-[#A1A1A6]">
                    {chart.data.slice(0, 5).map((row, rIdx) => (
                      <tr key={rIdx} className="hover:bg-[rgba(255,255,255,0.025)] transition">
                        {Object.entries(row).map(([k, v]) => (
                          <td key={k} className="py-2 px-3 font-mono text-[11px]">
                            {typeof v === 'number' 
                              ? (k.includes('pct') || k.includes('percentage') || k.includes('contrib') ? `${v}%` : `$${v.toLocaleString()}`) 
                              : String(v)}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // --- Main Application Component ---
    function App() {
      // 6 Main Steps
      // 'projects', 'data', 'problem', 'clarifications', 'execution', 'results'
      const [currentStep, setCurrentStep] = useState('projects');

      // State Management
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [health, setHealth] = useState({ operating_mode: 'DEMO_WITHOUT_LLM', mode_label: 'Inicializando...' });
      const [samplesCatalog, setSamplesCatalog] = useState({});

      // Data Upload & Preview State
      const [uploadFile, setUploadFile] = useState(null);
      const [uploadPreview, setUploadPreview] = useState(null);
      const [uploadOptions, setUploadOptions] = useState({
        delimiter: ',',
        encoding: 'utf-8',
        sheetName: '',
        tableName: '',
        headerRow: 0,
        replaceExisting: false
      });
      const [uploading, setUploading] = useState(false);
      const [uploadError, setUploadError] = useState(null);

      // Business Question & Interpretation State
      const [businessQuestion, setBusinessQuestion] = useState(
        "¿Cómo evolucionaron las ventas durante los periodos observados y dónde se concentra la mayor variación?"
      );
      const [interpretation, setInterpretation] = useState(null);
      const [interpreting, setInterpreting] = useState(false);
      const [userClarifications, setUserClarifications] = useState({});

      // Execution State
      const [currentRun, setCurrentRun] = useState(null);
      const [executing, setExecuting] = useState(false);
      const [runEvents, setRunEvents] = useState([]);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [runError, setRunError] = useState(null);

      // Results & Filter State
      const [artifacts, setArtifacts] = useState({});
      const [activeFilters, setActiveFilters] = useState({});
      const [recalculating, setRecalculating] = useState(false);
      const [showAuditSection, setShowAuditSection] = useState(false);

      // Chat State
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'assistant',
          text: 'Hola. Soy tu asistente analítico fundamentado. Puedes preguntarme sobre los hallazgos del diagnóstico, consultar la procedencia de cualquier cifra o pedirme recálculos aplicando filtros en tiempo real.',
          citations: []
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Timers & Polling
      const timerRef = useRef(null);

      useEffect(() => {
        fetch('/api/health')
          .then(r => r.json())
          .then(d => setHealth(d))
          .catch(e => console.error('Error al consultar salud:', e));

        fetch('/api/samples')
          .then(r => r.json())
          .then(d => setSamplesCatalog(d))
          .catch(e => console.error('Error al consultar catálogo de pruebas:', e));

        loadProjects();
      }, []);

      // Elapsed time counter during execution
      useEffect(() => {
        if (executing) {
          timerRef.current = setInterval(() => {
            setElapsedSeconds(s => s + 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [executing]);

      const loadProjects = async () => {
        try {
          const res = await fetch('/api/projects');
          const data = await res.json();
          setProjects(data);
          if (data.length > 0 && !selectedProject) {
            selectProject(data[0].project_id);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const selectProject = async (projectId) => {
        try {
          const res = await fetch(`/api/projects/${projectId}`);
          const data = await res.json();
          setSelectedProject(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleCreateProject = async () => {
        const name = prompt('Nombre del nuevo proyecto:');
        if (!name || !name.trim()) return;
        const desc = prompt('Descripción del análisis (opcional):') || '';
        try {
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim(), description: desc.trim() })
          });
          const newProj = await res.json();
          await loadProjects();
          await selectProject(newProj.project_id);
          setCurrentStep('data');
        } catch (e) {
          alert('Error al crear proyecto: ' + e);
        }
      };

      // Drag and drop / file selection for preview
      const handleFileSelected = async (file) => {
        if (!file || !selectedProject) return;
        setUploadFile(file);
        setUploadError(null);
        setUploading(true);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('delimiter', uploadOptions.delimiter);
        formData.append('encoding', uploadOptions.encoding);
        formData.append('header_row', uploadOptions.headerRow);
        if (uploadOptions.sheetName) {
          formData.append('sheet_name', uploadOptions.sheetName);
        }

        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/preview_upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Error al previsualizar archivo');
          }
          setUploadPreview(data);
          setUploadOptions(prev => ({
            ...prev,
            tableName: data.default_table_name,
            delimiter: data.sniff_info?.delimiter || prev.delimiter,
            encoding: data.sniff_info?.encoding || prev.encoding,
            sheetName: data.excel_info?.sheets?.[0] || ''
          }));
        } catch (err) {
          setUploadError(err.message);
          setUploadPreview(null);
        } finally {
          setUploading(false);
        }
      };

      const handleConfirmUpload = async () => {
        if (!uploadFile || !selectedProject) return;
        setUploading(true);
        setUploadError(null);

        const formData = new FormData();
        formData.append('file', uploadFile);
        formData.append('table_name', uploadOptions.tableName);
        formData.append('delimiter', uploadOptions.delimiter);
        formData.append('encoding', uploadOptions.encoding);
        formData.append('header_row', uploadOptions.headerRow);
        formData.append('replace_existing', uploadOptions.replaceExisting);
        if (uploadOptions.sheetName) {
          formData.append('sheet_name', uploadOptions.sheetName);
        }

        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) {
            if (res.status === 409) {
              // Collision prompt
              const replace = confirm(`${data.detail}\n\n¿Deseas REEMPLAZAR la versión existente de esta tabla?`);
              if (replace) {
                setUploadOptions(o => ({ ...o, replaceExisting: true }));
                // Retry with replace_existing = true
                formData.set('replace_existing', 'true');
                const retryRes = await fetch(`/api/projects/${selectedProject.project_id}/upload`, {
                  method: 'POST',
                  body: formData
                });
                if (!retryRes.ok) throw new Error('Error al reemplazar tabla');
              } else {
                setUploading(false);
                return;
              }
            } else {
              throw new Error(data.detail || 'Error al incorporar tabla');
            }
          }

          setUploadFile(null);
          setUploadPreview(null);
          await selectProject(selectedProject.project_id);
          alert('Tabla incorporada exitosamente al proyecto.');
        } catch (err) {
          setUploadError(err.message);
        } finally {
          setUploading(false);
        }
      };

      const handleDeleteFile = async (fileId) => {
        if (!confirm('¿Deseas eliminar esta tabla del proyecto?')) return;
        try {
          await fetch(`/api/projects/${selectedProject.project_id}/files/${fileId}`, { method: 'DELETE' });
          await selectProject(selectedProject.project_id);
        } catch (e) {
          alert('Error al eliminar archivo: ' + e);
        }
      };

      const handleLoadSample = async (sampleId) => {
        if (!selectedProject) return;
        setUploading(true);
        try {
          const res = await fetch(`/api/samples/${sampleId}/load_to_project/${selectedProject.project_id}`, { method: 'POST' });
          const data = await res.json();
          await selectProject(selectedProject.project_id);
          if (data.sample_metadata?.suggested_questions?.[0]) {
            setBusinessQuestion(data.sample_metadata.suggested_questions[0]);
          }
          alert(`Conjunto '${data.sample_metadata?.title || sampleId}' incorporado con éxito (${data.tables.length} tablas).`);
        } catch (e) {
          alert('Error al cargar datos de muestra: ' + e);
        } finally {
          setUploading(false);
        }
      };

      // Step 3: Interpret Business Question
      const handleInterpretQuestion = async () => {
        if (!selectedProject || !businessQuestion.trim()) return;
        setInterpreting(true);
        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/interpret_objective`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ objective_question: businessQuestion })
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Error en la pre-interpretación');
          }
          setInterpretation(data);

          // Populate default clarifications
          const defaultClarifs = {};
          data.clarifications_needed?.forEach(c => {
            defaultClarifs[c.id] = c.proposed_default;
          });
          setUserClarifications(defaultClarifs);

          setCurrentStep('clarifications');
        } catch (e) {
          alert('No fue posible interpretar el problema: ' + e.message);
        } finally {
          setInterpreting(false);
        }
      };

      // Step 5: Execute Analysis
      const handleExecuteAnalysis = async () => {
        if (!selectedProject || executing) return;
        setExecuting(true);
        setRunError(null);
        setElapsedSeconds(0);
        setCurrentStep('execution');

        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/runs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              objective_question: businessQuestion,
              user_clarifications: userClarifications
            })
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Error en la ejecución del pipeline');
          }

          setCurrentRun(data);
          // Fetch artifacts
          await fetchArtifacts(data.run_id);
          await fetchEvents(data.run_id);
          setCurrentStep('results');
        } catch (e) {
          setRunError(e.message);
        } finally {
          setExecuting(false);
        }
      };

      const handleCancelRun = async () => {
        if (!currentRun) return;
        try {
          await fetch(`/api/runs/${currentRun.run_id}/cancel`, { method: 'POST' });
          setExecuting(false);
          alert('Ejecución cancelada por el usuario.');
        } catch (e) {
          console.error(e);
        }
      };

      const fetchArtifacts = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/artifacts`);
          const data = await res.json();
          setArtifacts(data);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchEvents = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/events`);
          const data = await res.json();
          setRunEvents(data);
        } catch (e) {
          console.error(e);
        }
      };

      // Step 6: Recalculate Filtered Results
      const handleApplyFilter = async (dimKey, dimVal) => {
        const newFilters = { ...activeFilters, [dimKey]: dimVal };
        setActiveFilters(newFilters);
        setRecalculating(true);

        try {
          // Ask assistant for recalculation on the immutable snapshot
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project_id: selectedProject.project_id,
              run_id: currentRun.run_id,
              question: `Recalcular métricas para el filtro ${dimKey} = ${dimVal}`,
              active_filters: newFilters
            })
          });
          const data = await res.json();
          setChatMessages(prev => [
            ...prev,
            { sender: 'user', text: `Filtro aplicado: ${dimKey} = "${dimVal}"`, citations: [] },
            {
              sender: 'assistant',
              text: data.answer_text,
              citations: data.citations || [],
              calculationSummary: data.calculation_summary
            }
          ]);
        } catch (e) {
          console.error(e);
        } finally {
          setRecalculating(false);
        }
      };

      const handleResetFilters = () => {
        setActiveFilters({});
      };

      const handleSendChat = async (presetText) => {
        const query = presetText || chatInput;
        if (!query.trim() || !currentRun) return;

        const userMsg = { sender: 'user', text: query, citations: [] };
        setChatMessages(prev => [...prev, userMsg]);
        if (!presetText) setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project_id: selectedProject.project_id,
              run_id: currentRun.run_id,
              question: query,
              active_filters: activeFilters
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: data.answer_text,
            citations: data.citations || [],
            queryType: data.query_type,
            calculationSummary: data.calculation_summary,
            limitation: data.data_limitation_notice
          }]);
        } catch (e) {
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: 'Error al consultar al asistente: ' + e,
            citations: []
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      // 6 Navigation Steps in Spanish
      const steps = [
        { id: 'projects', label: '1. Proyecto', icon: <IconFolder /> },
        { id: 'data', label: '2. Cargar Datos', icon: <IconUpload /> },
        { id: 'problem', label: '3. Problema de Negocio', icon: <IconHelpCircle /> },
        { id: 'clarifications', label: '4. Aclaraciones y Plan', icon: <IconLayers /> },
        { id: 'execution', label: '5. Ejecución Observable', icon: <IconActivity /> },
        { id: 'results', label: '6. Resultados y Asistente', icon: <IconDashboard /> },

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#0A0A0B]">
          {/* macOS Glass Sidebar */}
          <aside className="w-64 flex-shrink-0 glass-surface border-r border-[rgba(255,255,255,0.08)] flex flex-col justify-between select-none z-30">
            <div>
              {/* macOS Traffic Lights Header */}

                <div className="flex space-x-1.5">
                  <span className="w-3 h-3 rounded-full bg-[#FF5F56]/80 border border-[#E0443E]/50 inline-block"></span>
                  <span className="w-3 h-3 rounded-full bg-[#FFBD2E]/80 border border-[#DEA123]/50 inline-block"></span>
                  <span className="w-3 h-3 rounded-full bg-[#27C93F]/80 border border-[#1AAB29]/50 inline-block"></span>
                </div>
                <div className="ml-1 font-semibold text-xs tracking-tight text-[#F5F5F7] truncate">
                  Analítica Adaptativa
                </div>
              </div>

              {/* 6 Guided Step Buttons */}
              <div className="px-3 py-4 space-y-1">
                <div className="px-3 text-[10px] font-semibold text-[#6E6E73] tracking-wider uppercase mb-2">
                  Flujo de Trabajo
                </div>
                {steps.map(step => {
                  const isActive = currentStep === step.id;
                  return (
                    <button
                      key={step.id}
                      onClick={() => setCurrentStep(step.id)}
                      className={`w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs font-medium transition-all ${

                    >
                      <span className={isActive ? 'text-[#2997FF]' : 'text-[#6E6E73]'}>
                        {step.icon}
                      </span>
                      <span>{step.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Sidebar Bottom: Status Indicators */}

              <div className="flex items-center justify-between text-[11px] text-[#8E8E93]">
                <span>Motor Analítico</span>
                <span className="font-mono text-[#F5F5F7]">DuckDB Parquet</span>
              </div>

                <span className="text-[#32D74B] font-medium">100% Determinista</span>

            </div>

          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* Top Bar Header */}

              <div className="flex items-center space-x-4">
                <span className="text-xs text-[#6E6E73] font-medium">Proyecto Activo:</span>
                <select

                  className="bg-[rgba(255,255,255,0.05)] border border-[rgba(255,255,255,0.1)] text-xs text-[#F5F5F7] rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-[#2997FF]"
                >
                  {projects.map(p => (
                    <option key={p.project_id} value={p.project_id} className="bg-[#18181B] text-[#F5F5F7]">

                <button

                >
                  + Nuevo Proyecto
                </button>
              </div>

              {/* Step Navigation shortcuts */}
              <div className="flex items-center space-x-3">
                {currentStep !== 'execution' && currentStep !== 'results' && (
                  <button
                    onClick={() => {
                      if (currentStep === 'projects') setCurrentStep('data');
                      else if (currentStep === 'data') setCurrentStep('problem');
                      else if (currentStep === 'problem') handleInterpretQuestion();
                      else if (currentStep === 'clarifications') handleExecuteAnalysis();
                    }}
                    className="btn-apple-primary px-3.5 py-1.5 text-xs flex items-center space-x-1.5"
                  >
                    <span>Continuar al Paso Siguiente</span>
                    <IconChevronRight />
                  </button>
                )}
              </div>
            </header>

            {/* Scrollable Main Body */}
            <main className="flex-1 overflow-y-auto px-8 py-8 space-y-8 max-w-6xl mx-auto w-full">

              {/* PASO 1: SELECCIONAR O CREAR PROYECTO */}
              {currentStep === 'projects' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Paso 1: Proyectos de Análisis</h2>
                    <p className="text-sm text-[#8E8E93] mt-1">
                      Selecciona un espacio de trabajo existente o crea uno nuevo para iniciar una investigación con tus propios datos.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {projects.map(p => {
                      const isSel = selectedProject?.project_id === p.project_id;
                      return (
                        <div
                          key={p.project_id}
                          onClick={() => selectProject(p.project_id)}
                          className={`glass-card p-6 cursor-pointer transition ${
                            isSel ? 'border-[#2997FF] shadow-[0_0_24px_rgba(41,151,255,0.15)] bg-[rgba(255,255,255,0.06)]' : ''
                          }`}
                        >
                          <div className="flex justify-between items-start">
                            <h3 className="text-base font-semibold text-[#F5F5F7]">{p.name}</h3>
                            {isSel && <span className="pill-accent text-[10px] px-2 py-0.5 rounded-full">Activo</span>}
                          </div>
                          <p className="text-xs text-[#8E8E93] mt-2 line-clamp-2">
                            {p.description || 'Sin descripción'}
                          </p>
                          <div className="pt-4 mt-6 border-t border-[rgba(255,255,255,0.06)] flex justify-between items-center text-[11px] text-[#6E6E73]">
                            <span>ID: {p.project_id.slice(0, 10)}</span>
                            <span>{p.files_count || (p.files ? p.files.length : 0)} tablas</span>
                          </div>
                        </div>
                      );
                    })}

                    <div
                      onClick={handleCreateProject}
                      className="glass-card p-6 border-dashed border-[rgba(255,255,255,0.2)] hover:border-[#2997FF] flex flex-col items-center justify-center text-center cursor-pointer min-h-[140px]"
                    >
                      <div className="w-8 h-8 rounded-full bg-[rgba(255,255,255,0.05)] flex items-center justify-center text-[#2997FF] mb-2">
                        +
                      </div>
                      <span className="text-xs font-medium text-[#F5F5F7]">Crear Nuevo Proyecto</span>
                      <span className="text-[11px] text-[#6E6E73] mt-0.5">Espacio en blanco aislado</span>
                    </div>
                  </div>

                  {/* Conjuntos de Datos de Prueba Descargables */}
                  <div className="mt-10 pt-8 border-t border-[rgba(255,255,255,0.08)] space-y-4">
                    <div className="flex justify-between items-end">
                      <div>
                        <h3 className="text-lg font-semibold text-[#F5F5F7]">Conjuntos de Datos de Prueba Descargables</h3>
                        <p className="text-xs text-[#8E8E93] mt-0.5">
                          Tres escenarios calculados independientemente para evaluar el comportamiento del sistema.
                        </p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {Object.values(samplesCatalog).map(s => (
                        <div key={s.id} className="glass-card p-5 flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className="pill-neutral text-[10px] font-mono uppercase px-2 py-0.5 rounded">
                                {s.format}
                              </span>
                              <span className="text-[10px] text-[#6E6E73]">Verificable</span>
                            </div>
                            <h4 className="text-sm font-semibold text-[#F5F5F7]">{s.title}</h4>
                            <p className="text-xs text-[#8E8E93] mt-2 leading-relaxed">{s.description}</p>
                            
                            <div className="mt-3 p-2.5 bg-[rgba(255,255,255,0.025)] rounded-lg text-[11px] text-[#A1A1A6] space-y-1">
                              <div><strong>Archivos:</strong> {s.files.join(', ')}</div>
                              <div><strong>Comportamiento:</strong> {s.expected_handling}</div>
                            </div>
                          </div>

                          <div className="pt-4 mt-4 border-t border-[rgba(255,255,255,0.06)] flex space-x-2">
                            {s.files.map(f => {
                              const cleanF = f.split(' ')[0];
                              return (
                                <a
                                  key={f}
                                  href={`/api/samples/${s.id}/download/${cleanF}`}
                                  download
                                  className="btn-apple-secondary flex-1 text-center py-1.5 text-[11px]"
                                >
                                  Descargar
                                </a>
                              );
                            })}
                            <button
                              onClick={() => handleLoadSample(s.id)}
                              className="btn-apple-primary px-3 py-1.5 text-[11px]"
                            >
                              Cargar al Proyecto
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PASO 2: CARGAR Y REVISAR DATOS */}
              {currentStep === 'data' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Paso 2: Cargar y Revisar Datos</h2>
                    <p className="text-sm text-[#8E8E93] mt-1">
                      Sube archivos CSV o libros de Excel XLSX. Configura delimitadores, codificación u hojas y revisa la vista previa antes de incorporar.
                    </p>
                  </div>

                  {/* Drag & Drop Upload Zone */}
                  <div
                    onDragOver={e => e.preventDefault()}
                    onDrop={e => {
                      e.preventDefault();
                      if (e.dataTransfer.files?.[0]) handleFileSelected(e.dataTransfer.files[0]);
                    }}
                    className="glass-card p-8 border-2 border-dashed border-[rgba(255,255,255,0.15)] hover:border-[#2997FF] transition flex flex-col items-center justify-center text-center cursor-pointer"
                    onClick={() => document.getElementById('file-input-upload').click()}
                  >
                    <input
                      id="file-input-upload"
                      type="file"
                      accept=".csv, .xlsx"
                      className="hidden"
                      onChange={e => {
                        if (e.target.files?.[0]) handleFileSelected(e.target.files[0]);
                      }}
                    />
                    <div className="w-12 h-12 rounded-full bg-[rgba(41,151,255,0.12)] text-[#2997FF] flex items-center justify-center mb-3">
                      <IconUpload />
                    </div>
                    <h3 className="text-sm font-semibold text-[#F5F5F7]">
                      Arrastra y suelta tu archivo CSV o XLSX aquí
                    </h3>
                    <p className="text-xs text-[#8E8E93] mt-1">
                      O haz clic para explorar en tu computadora. Detección automática de delimitador y ceros iniciales.
                    </p>
                  </div>

                  {/* Modal / Card de Previsualización Interactivo */}
                  {uploadPreview && (
                    <div className="glass-modal p-6 rounded-2xl border border-[rgba(41,151,255,0.3)] space-y-5">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="pill-accent text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full">
                            Vista Previa de Incorporación
                          </span>
                          <h3 className="text-base font-semibold text-[#F5F5F7] mt-1.5">
                            {uploadPreview.filename}
                          </h3>
                        </div>
                        <button
                          onClick={() => setUploadPreview(null)}
                          className="text-[#8E8E93] hover:text-[#FFFFFF] text-xs"
                        >
                          Cancelar
                        </button>
                      </div>

                      {/* Parámetros de Interpretación */}
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-[rgba(255,255,255,0.025)] rounded-xl text-xs">
                        <div>
                          <label className="text-[#8E8E93] block mb-1 font-medium">Nombre de la Tabla:</label>
                          <input
                            type="text"
                            value={uploadOptions.tableName}
                            onChange={e => setUploadOptions({ ...uploadOptions, tableName: e.target.value })}
                            className="input-apple w-full"
                          />
                        </div>

                        {uploadPreview.filename.endsWith('.csv') && (
                          <>
                            <div>
                              <label className="text-[#8E8E93] block mb-1 font-medium">Delimitador:</label>
                              <select
                                value={uploadOptions.delimiter}
                                onChange={e => {
                                  setUploadOptions({ ...uploadOptions, delimiter: e.target.value });
                                  handleFileSelected(uploadFile);
                                }}
                                className="input-apple w-full"
                              >
                                <option value=",">Coma (,)</option>
                                <option value=";">Punto y coma (;)</option>
                                <option value="	">Tabulación (	)</option>
                                <option value="|">Barra (|)</option>
                              </select>
                            </div>
                            <div>
                              <label className="text-[#8E8E93] block mb-1 font-medium">Codificación:</label>
                              <select
                                value={uploadOptions.encoding}
                                onChange={e => {
                                  setUploadOptions({ ...uploadOptions, encoding: e.target.value });
                                  handleFileSelected(uploadFile);
                                }}
                                className="input-apple w-full"
                              >
                                <option value="utf-8">UTF-8</option>
                                <option value="latin-1">Latin-1 / ISO-8859-1</option>
                                <option value="cp1252">Windows CP-1252</option>
                              </select>

                          </>

                        {uploadPreview.filename.endsWith('.xlsx') && (

                            <select

                              onChange={e => {
                                setUploadOptions({ ...uploadOptions, sheetName: e.target.value });
                                handleFileSelected(uploadFile);

                              className="input-apple w-full"
                            >
                              {uploadPreview.excel_info?.sheets?.map(s => (

                            </select>

                        <div>

                            min="0"
                            value={uploadOptions.headerRow}

                              handleFileSelected(uploadFile);
                            }}
                            className="input-apple w-full"

                        </div>
                      </div>

                      {/* Advertencias */}

                        <div>
                          <h4 className="text-xs font-semibold text-[#F5F5F7] mb-2 font-sans">
                            Hashes de Inmutabilidad SHA-256 (Archivos y Snapshot)
                          </h4>
                          <div className="space-y-1 bg-[rgba(0,0,0,0.4)] p-3 rounded-xl border border-[rgba(255,255,255,0.04)] text-[11px]">
                            {selectedProject?.files?.map(f => (
                              <div key={f.file_id}>
                                Tabla [{f.table_name}]: <span className="text-[#2997FF]">{f.file_hash}</span>
                              </div>
                            ))}
                            {artifacts.DataSnapshot && (
                              <div className="text-[#32D74B] pt-1 border-t border-[rgba(255,255,255,0.06)]">
                                Snapshot Parquet [{artifacts.DataSnapshot.run_id}]: {artifacts.DataSnapshot.file_hash}
                              </div>
                            )}
                          </div>
                        </div>

                        <div>
                          <h4 className="text-xs font-semibold text-[#F5F5F7] mb-2 font-sans">
                            Eventos de Orquestación y DAG
                          </h4>
                          <div className="max-h-48 overflow-y-auto space-y-1 bg-[rgba(0,0,0,0.4)] p-3 rounded-xl border border-[rgba(255,255,255,0.04)] text-[10px]">
                            {runEvents.map(ev => (
                              <div key={ev.event_id} className="text-[#8E8E93]">
                                [{ev.stage}] {ev.level}: {ev.message}
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
