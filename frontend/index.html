<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Multi-Agent Analytics Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for TSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset('custom-react', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-canvas: #0A0A0B;
      --bg-surface: #121214;
      --bg-surface-elevated: #18181B;
      --bg-card: rgba(255, 255, 255, 0.035);
      --bg-card-hover: rgba(255, 255, 255, 0.055);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.14);
      --accent-blue: #2997FF;
      --accent-blue-hover: #1A85FF;
      --accent-glow: rgba(41, 151, 255, 0.25);
      --text-primary: #F5F5F7;
      --text-secondary: #A1A1A6;
      --text-tertiary: #6E6E73;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Apple Liquid Glass Utility */
    .glass-surface {
      background: rgba(18, 18, 20, 0.72);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .glass-modal {
      background: rgba(22, 22, 24, 0.88);
      backdrop-filter: blur(32px) saturate(150%);
      -webkit-backdrop-filter: blur(32px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 64px -8px rgba(0, 0, 0, 0.75);
    }

    /* Apple Status Pills */
    .pill-accent {
      background: rgba(41, 151, 255, 0.12);
      color: #2997FF;
      border: 1px solid rgba(41, 151, 255, 0.28);
    }
    .pill-success {
      background: rgba(50, 215, 75, 0.12);
      color: #32D74B;
      border: 1px solid rgba(50, 215, 75, 0.28);
    }
    .pill-warning {
      background: rgba(255, 159, 10, 0.12);
      color: #FF9F0A;
      border: 1px solid rgba(255, 159, 10, 0.28);
    }
    .pill-danger {
      background: rgba(255, 69, 58, 0.12);
      color: #FF453A;
      border: 1px solid rgba(255, 69, 58, 0.28);
    }
    .pill-neutral {
      background: rgba(255, 255, 255, 0.06);
      color: #A1A1A6;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Buttons */
    .btn-apple-primary {
      background: var(--accent-blue);
      color: #FFFFFF;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(41, 151, 255, 0.3);
    }
    .btn-apple-primary:hover:not(:disabled) {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(41, 151, 255, 0.4);
    }
    .btn-apple-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-apple-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-apple-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .btn-apple-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Inputs */
    .input-apple {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-radius: 12px;
      height: 42px;
      padding: 0 14px;
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .input-apple:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-apple::placeholder {
      color: var(--text-tertiary);
    }
  </style>
</head>
<body class="bg-[#0A0A0B] text-[#F5F5F7] min-h-screen flex antialiased selection:bg-[#2997FF]/30 selection:text-[#FFFFFF]">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel" data-presets="custom-react">
    const { useState, useEffect, useRef } = React;

    // --- Minimal Monochromatic SVG Icons (1.5px stroke) ---
    const IconFolder = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
      </svg>
    );

    const IconTable = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>
      </svg>
    );

    const IconTarget = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
    );

    const IconShieldCheck = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const IconLayers = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
      </svg>
    );

    const IconActivity = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    );

    const IconDashboard = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
      </svg>
    );

    const IconMessage = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );

    const IconGitCommit = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/>
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    );

    const IconDownload = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    );

    const IconPlay = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    );

    const IconAlert = () => (
      <svg className="w-4 h-4 text-[#FF9F0A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-3.5 h-3.5 text-[#32D74B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    // --- Dynamic Canvas Charts Component (Apple macOS Dark Theme) ---
    function DashboardCharts({ charts }) {
      const chartRefs = useRef([]);

      useEffect(() => {
        if (!charts || charts.length === 0) return;

        const chartInstances = [];

        charts.forEach((chart, idx) => {
          const canvas = chartRefs.current[idx];
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          // Prepare data
          const labels = chart.data.map(d => d.channel || d.period || Object.values(d)[0]);
          const metricKeys = Object.keys(chart.data[0] || {}).filter(k => 
            typeof chart.data[0][k] === 'number' && !k.includes('order_count')
          );
          const primaryKey = metricKeys[0] || 'net_sales';
          const values = chart.data.map(d => d[primaryKey] || 0);

          const isTrend = chart.id.includes('trend') || labels.some(l => typeof l === 'string' && l.startsWith('2026-'));

          const instance = new Chart(ctx, {
            type: isTrend ? 'line' : 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: primaryKey.replace('_', ' ').toUpperCase(),
                data: values,
                backgroundColor: isTrend 
                  ? 'rgba(41, 151, 255, 0.12)' 
                  : values.map(v => v < 0 ? 'rgba(255, 69, 58, 0.65)' : 'rgba(41, 151, 255, 0.65)'),
                borderColor: isTrend ? '#2997FF' : values.map(v => v < 0 ? '#FF453A' : '#2997FF'),
                borderWidth: isTrend ? 2 : 1,
                fill: isTrend,
                tension: 0.35,
                borderRadius: isTrend ? 0 : 8,
                pointBackgroundColor: '#2997FF',
                pointBorderColor: '#0A0A0B',
                pointBorderWidth: 2,
                pointRadius: isTrend ? 4 : 0,
                pointHoverRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(22, 22, 24, 0.9)',
                  titleColor: '#F5F5F7',
                  bodyColor: '#A1A1A6',
                  borderColor: 'rgba(255, 255, 255, 0.12)',
                  borderWidth: 1,
                  padding: 10,
                  cornerRadius: 10,
                  displayColors: false,
                  callbacks: {
                    label: function(context) {
                      const val = context.parsed.y;
                      return `${context.dataset.label}: $${val.toLocaleString()}`;
                    }
                  }
                }
              },
              scales: {
                x: {
                  grid: { display: false },
                  ticks: { color: '#6E6E73', font: { size: 11, family: '-apple-system, sans-serif' } }
                },
                y: {
                  grid: { color: 'rgba(255, 255, 255, 0.04)' },
                  ticks: { 
                    color: '#6E6E73', 
                    font: { size: 11, family: '-apple-system, sans-serif' },
                    callback: (v) => '$' + (v >= 1000 ? (v / 1000) + 'k' : v)
                  }
                }
              }
            }
          });

          chartInstances.push(instance);
        });

        return () => {
          chartInstances.forEach(ci => ci.destroy());
        };
      }, [charts]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {charts.map((chart, idx) => (
            <div key={chart.id} className="glass-card p-6 flex flex-col justify-between">
              <div>
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <h4 className="text-sm font-semibold tracking-tight text-[#F5F5F7]">{chart.title}</h4>
                    <p className="text-xs text-[#8E8E93] mt-0.5">{chart.question_answered}</p>
                  </div>
                  {chart.is_primary_objective && (
                    <span className="pill-accent text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full">
                      Primary Objective
                    </span>
                  )}
                </div>

                {/* Canvas chart */}
                <div className="h-56 w-full relative mb-5">
                  <canvas ref={el => chartRefs.current[idx] = el}></canvas>
                </div>
              </div>

              {/* Data Table Breakdown */}
              <div className="overflow-x-auto border-t border-[rgba(255,255,255,0.06)] pt-4">
                <table className="w-full text-xs text-left">
                  <thead>
                    <tr className="text-[#6E6E73] uppercase tracking-wider text-[10px] border-b border-[rgba(255,255,255,0.06)]">
                      {Object.keys(chart.data[0] || {}).map(k => (
                        <th key={k} className="py-2 px-3 font-medium">{k.replace('_', ' ')}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[rgba(255,255,255,0.04)] text-[#A1A1A6]">
                    {chart.data.map((row, rIdx) => (
                      <tr key={rIdx} className="hover:bg-[rgba(255,255,255,0.025)] transition">
                        {Object.entries(row).map(([k, v]) => (
                          <td key={k} className="py-2 px-3 font-mono text-[11px]">
                            {typeof v === 'number' 
                              ? (k.includes('pct') || k.includes('percentage') || k.includes('contrib') ? `${v}%` : `$${v.toLocaleString()}`) 
                              : String(v)}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // --- Main Application ---
    function App() {
      const [activeTab, setActiveTab] = useState('projects');
      const [health, setHealth] = useState({ is_demo_mode: true, mode_label: 'Loading...', operating_mode: 'DEMO_WITHOUT_LLM' });
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [currentRun, setCurrentRun] = useState(null);
      const [artifacts, setArtifacts] = useState({});
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'assistant',
          text: 'Welcome. I am your grounded analytical assistant. You can ask me questions about diagnostic drivers, explore recalculations with real data filters, or verify empirical citations.',
          citations: []
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      useEffect(() => {
        fetch('/api/health')
          .then(r => r.json())
          .then(data => setHealth(data))
          .catch(err => console.error('Error fetching health:', err));

        loadProjects();
      }, []);

      const loadProjects = async () => {
        try {
          const res = await fetch('/api/projects');
          const data = await res.json();
          setProjects(data);
          if (data.length > 0 && !selectedProject) {
            selectProject(data[0].project_id);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const selectProject = async (projectId) => {
        try {
          const res = await fetch(`/api/projects/${projectId}`);
          const data = await res.json();
          setSelectedProject(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleCreateProject = async (e) => {
        e.preventDefault();
        const name = prompt('New project name:');
        if (!name) return;
        const desc = prompt('Description (optional):') || '';
        try {
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description: desc })
          });
          const newProj = await res.json();
          await loadProjects();
          selectProject(newProj.project_id);
        } catch (e) {
          alert('Error creating project: ' + e);
        }
      };

      const handleLoadDemo = async () => {
        if (!selectedProject) return;
        setLoading(true);
        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/load_demo`, { method: 'POST' });
          const data = await res.json();
          alert(`Demo dataset loaded successfully (${data.tables_loaded.length} tables).`);
          await selectProject(selectedProject.project_id);
          setActiveTab('catalog');
        } catch (e) {
          alert('Error loading demo: ' + e);
        } finally {
          setLoading(false);
        }
      };

      const handleStartRun = async (forceError = false) => {
        if (!selectedProject) return;
        setLoading(true);
        setActiveTab('execution');
        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/runs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              objective_question: "Sales declined over recent months. I want to understand where the drop is concentrated, what observable factors explain it, and what actions should be investigated.",
              user_clarifications: { metric_definition: 'net_sales', period_cutoff: 'exclude_incomplete_period' },
              force_error_for_test: forceError
            })
          });
          const data = await res.json();
          if (res.ok) {
            setCurrentRun(data);
            await fetchArtifacts(data.run_id);
            await fetchEvents(data.run_id);
            setActiveTab('dashboard');
          } else {
            alert('Pipeline execution failed: ' + (data.detail || JSON.stringify(data)));
          }
        } catch (e) {
          alert('Error starting execution: ' + e);
        } finally {
          setLoading(false);
        }
      };

      const fetchArtifacts = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/artifacts`);
          const data = await res.json();
          setArtifacts(data);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchEvents = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/events`);
          const data = await res.json();
          setEvents(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleSendChat = async (presetText) => {
        const query = presetText || chatInput;
        if (!query.trim() || !currentRun) return;

        const userMsg = { sender: 'user', text: query, citations: [] };
        setChatMessages(prev => [...prev, userMsg]);
        if (!presetText) setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project_id: selectedProject.project_id,
              run_id: currentRun.run_id,
              question: query,
              active_filters: {}
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: data.answer_text,
            citations: data.citations || [],
            queryType: data.query_type,
            calculationSummary: data.calculation_summary,
            limitation: data.data_limitation_notice
          }]);
        } catch (e) {
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: 'Error contacting assistant: ' + e,
            citations: []
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      const navigationSections = [
        {
          title: "WORKSPACE & DATA",
          items: [
            { id: 'projects', label: 'Projects & Setup', icon: <IconFolder /> },
            { id: 'catalog', label: 'Tables & Profiling', icon: <IconTable /> },
          ]
        },
        {
          title: "ANALYTICAL RIGOR",
          items: [
            { id: 'objective', label: 'Objective & Scope', icon: <IconTarget /> },
            { id: 'quality', label: 'Quality & Relations', icon: <IconShieldCheck /> },
            { id: 'plan', label: 'Analysis Plan', icon: <IconLayers /> },
          ]
        },
        {
          title: "EXECUTION & INSIGHTS",
          items: [
            { id: 'execution', label: 'Progress & Audit', icon: <IconActivity /> },
            { id: 'dashboard', label: 'Validated Dashboard', icon: <IconDashboard /> },
            { id: 'provenance', label: 'Provenance Chain', icon: <IconGitCommit /> },
          ]
        },
        {
          title: "INTELLIGENCE",
          items: [
            { id: 'chat', label: 'Contextual Assistant', icon: <IconMessage /> },
          ]
        }
      ];

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#0A0A0B]">
          {/* macOS Glass Sidebar */}
          <aside className="w-64 flex-shrink-0 glass-surface border-r border-[rgba(255,255,255,0.08)] flex flex-col justify-between select-none z-30">
            <div>
              {/* App Title / macOS Traffic Lights Header */}

                    <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Methodological Analysis Plan</h2>
                    <p className="text-sm text-[#8E8E93] mt-1">
                      Validated operations proposed by Methodologist Agent, defensible through scientific citations.
                    </p>
                  </div>

                  <div className="glass-card p-6">
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="text-base font-semibold text-[#F5F5F7]">
                        {artifacts.AnalysisPlan?.title || 'Registered Analysis Plan'}
                      </h3>
                      <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full ${
                        health.operating_mode === 'LLM_ENABLED' ? 'pill-success' : 'pill-neutral'
                      }`}>
                        {health.operating_mode === 'LLM_ENABLED' ? '[Proposed by Gemini & Validated against Catalog]' : '[Deterministic Methods Catalog]'}
                      </span>
                    </div>
                    <p className="text-xs text-[#8E8E93] leading-relaxed">{artifacts.AnalysisPlan?.rationale}</p>
                  </div>

                  {artifacts.AnalysisPlan?.operations?.map((op, idx) => (
                    <div key={op.step_id} className="glass-card p-5">
                      <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center space-x-3">
                          <span className="w-6 h-6 rounded-full bg-[rgba(255,255,255,0.08)] text-[#F5F5F7] text-xs flex items-center justify-center font-bold">
                            {idx + 1}
                          </span>
                          <h4 className="text-xs font-semibold text-[#F5F5F7]">{op.operation_name}</h4>
                        </div>
                        <span className="pill-neutral text-[10px] font-mono px-2.5 py-0.5 rounded">
                          {op.category}
                        </span>
                      </div>
                      <p className="text-xs text-[#A1A1A6] ml-9 leading-relaxed">{op.description}</p>
                      <div className="ml-9 mt-3 flex flex-wrap gap-4 text-[11px] text-[#6E6E73]">
                        <div><strong className="text-[#8E8E93]">Inputs:</strong> {op.required_inputs.join(', ')}</div>
                        <div><strong className="text-[#8E8E93]">Assumptions:</strong> {op.assumptions.join(' | ')}</div>
                      </div>
                    </div>
                  ))}

                  {artifacts.AnalysisPlan?.citations?.length > 0 && (
                    <div className="glass-card p-6 border border-[rgba(41,151,255,0.2)]">
                      <h4 className="text-xs font-semibold text-[#2997FF] uppercase tracking-wider mb-3">
                        Methodological Citations & Theoretical Grounding
                      </h4>
                      <div className="space-y-2">
                        {artifacts.AnalysisPlan.citations.map((c, i) => (
                          <div key={i} className="text-xs text-[#A1A1A6]">
                            <a href={c.url} target="_blank" className="font-semibold text-[#2997FF] hover:underline">
                              {c.title}
                            </a>: "{c.supported_claim}"
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 6: PROGRESS & AUDIT */}
              {activeTab === 'execution' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Progress & Audit Trail</h2>
                      <p className="text-sm text-[#8E8E93] mt-1">
                        Observable state machine transitions, error detection, and automated repair loop validation.
                      </p>
                    </div>
                    <button
                      onClick={() => handleStartRun(true)}
                      className="btn-apple-secondary px-3.5 py-1.5 text-xs text-[#FF453A] border-[#FF453A]/30 hover:bg-[#FF453A]/10"
                      title="Injects NaN to verify independent validator rejection and automated repair loop"
                    >
                      [Test Repair Cycle: Inject Error]
                    </button>
                  </div>

                  {/* Terminal Log Stream */}
                  <div className="glass-card p-5 bg-[#050506]/90 border border-[rgba(255,255,255,0.08)] font-mono text-xs space-y-2 max-h-96 overflow-y-auto">
                    {events.length > 0 ? (
                      events.map(ev => (
                        <div key={ev.event_id} className="flex space-x-3 text-[11px] border-b border-[rgba(255,255,255,0.03)] pb-1.5">
                          <span className="text-[#6E6E73]">{new Date(ev.created_at).toLocaleTimeString()}</span>
                          <span className="text-[#2997FF] font-bold">[{ev.stage}]</span>
                          <span className={ev.level === 'ERROR' ? 'text-[#FF453A] font-bold' : 'text-[#A1A1A6]'}>
                            {ev.message}
                          </span>
                        </div>
                      ))
                    ) : (
                      <div className="text-[#6E6E73] italic">Awaiting pipeline start...</div>
                    )}
                  </div>

                  {/* Transformation Records */}
                  {artifacts.TransformationRecords?.length > 0 && (
                    <div className="glass-card p-6">
                      <h3 className="text-sm font-semibold text-[#F5F5F7] mb-4">Auditable Transformation Log</h3>
                      <div className="space-y-3">
                        {artifacts.TransformationRecords.map(t => (
                          <div key={t.transformation_id} className="p-3.5 rounded-xl bg-[rgba(255,255,255,0.02)] border border-[rgba(255,255,255,0.06)] text-xs">
                            <div className="flex justify-between font-semibold text-[#F5F5F7]">
                              <span>{t.step_index}. {t.operation} (ID: {t.transformation_id})</span>
                              <span className="text-[#8E8E93] font-mono">Rows: {t.rows_before} -&gt; {t.rows_after} (Excluded: {t.rows_excluded})</span>
                            </div>
                            <p className="text-[#8E8E93] mt-1.5">{t.rationale}</p>
                            {t.join_check && (
                              <div className="mt-2.5 p-2 bg-[rgba(0,0,0,0.3)] rounded-lg border border-[rgba(255,255,255,0.06)] text-[11px] text-[#A1A1A6] flex justify-between">
                                <span>Join with <strong>{t.join_check.right_table}</strong>: factor {t.join_check.multiplication_factor}x</span>
                                <span className="text-[#32D74B] font-semibold">[Metric Reconciled: {t.join_check.metric_reconciled ? 'YES' : 'NO'}]</span>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 7: VALIDATED DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  {artifacts.DashboardSpec ? (
                    <>
                      {/* Dashboard Header Bar */}
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="flex flex-wrap items-center gap-2 mb-2">
                            <span className="pill-success text-xs font-semibold px-3 py-0.5 rounded-full uppercase tracking-wider">
                              [Validated Dashboard - 100% Reconciled]
                            </span>
                            <span className="pill-neutral text-[11px] px-2.5 py-0.5 rounded-full">
                              [Calculated by Engine: DuckDB / Pandas]
                            </span>
                            <span className="pill-accent text-[11px] px-2.5 py-0.5 rounded-full">
                              [Deterministically Validated]
                            </span>
                          </div>
                          <h2 className="text-3xl font-semibold tracking-tight text-[#F5F5F7] mt-1">
                            {artifacts.DashboardSpec.title}
                          </h2>
                          <p className="text-xs text-[#8E8E93] mt-1">{artifacts.DashboardSpec.subtitle}</p>
                        </div>
                        <button
                          onClick={() => window.print()}
                          className="btn-apple-secondary px-3 py-1.5 text-xs"
                        >
                          Print / Export
                        </button>
                      </div>

                      {/* Metric Cards Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {artifacts.DashboardSpec.metric_cards.map(card => (
                          <div key={card.id} className="glass-card p-5">
                            <span className="text-xs font-medium text-[#8E8E93]">{card.title}</span>
                            <div className="text-3xl font-semibold tracking-tight text-[#F5F5F7] mt-2 font-mono">
                              {card.value}
                            </div>
                            {card.comparison_text && (
                              <p className={`text-xs mt-2 font-medium flex items-center space-x-1 ${
                                card.trend_direction === 'down' ? 'text-[#FF453A]' : 'text-[#32D74B]'
                              }`}>
                                <span>{card.trend_direction === 'down' ? 'v' : '^'}</span>
                                <span>{card.comparison_text}</span>
                              </p>
                            )}
                            <div className="mt-3 text-[10px] text-[#6E6E73] border-t border-[rgba(255,255,255,0.06)] pt-1.5">
                              Period: {card.period}
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Executive Findings & Verified Diagnosis */}
                      {artifacts.InsightReport && (
                        <div className="glass-card p-6 space-y-5">
                          <div className="flex items-center justify-between">
                            <h3 className="text-xs font-semibold text-[#8E8E93] uppercase tracking-wider">
                              Executive Findings & Verified Diagnosis
                            </h3>
                            <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full ${
                              health.operating_mode === 'LLM_ENABLED' ? 'pill-success' : 'pill-neutral'
                            }`}>
                              {health.operating_mode === 'LLM_ENABLED'
                                ? '[Drafted by Gemini with Verified DuckDB Citations]'
                                : '[Drafted by Deterministic Catalog Engine]'}
                            </span>
                          </div>

                          <p className="text-sm text-[#F5F5F7] leading-relaxed bg-[rgba(255,255,255,0.02)] p-4 rounded-xl border border-[rgba(255,255,255,0.06)]">
                            {artifacts.InsightReport.executive_summary}
                          </p>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                              <h4 className="text-[11px] font-semibold text-[#6E6E73] uppercase mb-2">
                                Observed Findings (Empirically Verified)
                              </h4>
                              <div className="space-y-2">
                                {artifacts.InsightReport.observed_findings.map(f => (
                                  <div key={f.id} className="text-xs text-[#F5F5F7] bg-[rgba(255,255,255,0.02)] p-3 rounded-xl border border-[rgba(255,255,255,0.06)]">
                                    <strong className="text-[#2997FF]">[Verified]</strong> {f.claim}
                                    <div className="text-[10px] text-[#6E6E73] mt-1 font-mono">Linked result ID: {f.result_id}</div>
                                  </div>
                                ))}
                              </div>
                            </div>

                            <div>
                              <h4 className="text-[11px] font-semibold text-[#6E6E73] uppercase mb-2">
                                Suggested Action Proposals
                              </h4>
                              <div className="space-y-2">
                                {artifacts.InsightReport.recommended_actions.map(act => (
                                  <div key={act.id} className="text-xs text-[#F5F5F7] bg-[rgba(50,215,75,0.04)] p-3 rounded-xl border border-[rgba(50,215,75,0.15)]">
                                    <strong className="text-[#32D74B]">{act.title}</strong>: {act.description}
                                    <div className="text-[10px] text-[#8E8E93] mt-1 italic">
                                      Hypothesis to confirm: {act.hypothesis_to_investigate} (Requires qualitative confirmation)
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Charts and Data Visualizations */}
                      {artifacts.DashboardSpec.charts && (
                        <DashboardCharts charts={artifacts.DashboardSpec.charts} />
                      )}

                      {/* Limitations Banner */}
                      {artifacts.DashboardSpec.quality_alerts?.length > 0 && (
                        <div className="glass-card p-5 border border-[rgba(255,159,10,0.25)] bg-[rgba(255,159,10,0.03)]">
                          <h4 className="text-xs font-semibold text-[#FF9F0A] uppercase tracking-wider mb-2">
                            [Notice] Data Limitations & Methodological Boundaries
                          </h4>
                          <ul className="text-xs text-[#A1A1A6] list-disc list-inside space-y-1">
                            {artifacts.DashboardSpec.quality_alerts.map((al, idx) => (
                              <li key={idx}>{al}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </>
                  ) : (
                    <div className="glass-card p-16 text-center text-xs text-[#8E8E93]">
                      Execute the workflow to generate the validated, interactive dashboard.
                    </div>
                  )}
                </div>
              )}

              {/* TAB 8: CONTEXTUAL CHAT ASSISTANT */}
              {activeTab === 'chat' && (
                <div className="space-y-6 max-w-4xl mx-auto">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Contextual Assistant</h2>
                      <p className="text-sm text-[#8E8E93] mt-1">
                        Query verified analytical results, trigger recalculations with dynamic filters, and inspect citations.
                      </p>
                    </div>
                    <span className="pill-neutral text-[11px] font-mono px-3 py-1 rounded-full">
                      Mode: {health.mode_label}
                    </span>
                  </div>

                  {/* Suggestion Chips */}
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() => handleSendChat('Why do we conclude the decline is concentrated in wholesale?')}
                      className="btn-apple-secondary text-xs px-3 py-1.5"
                    >
                      [Explain wholesale decline concentration]
                    </button>
                    <button
                      onClick={() => handleSendChat('How much was sold in the Metropolitan region?')}
                      className="btn-apple-secondary text-xs px-3 py-1.5"
                    >
                      [Recalculate Metropolitan sales]
                    </button>
                    <button
                      onClick={() => handleSendChat('Which competitor lowered prices to cause the sales drop?')}
                      className="btn-apple-secondary text-xs px-3 py-1.5 text-[#FF9F0A]"
                    >
                      [Test unanswerable query: Competitor]
                    </button>
                  </div>

                  {/* Message Stream */}
                  <div className="glass-card p-5 min-h-[380px] max-h-[520px] overflow-y-auto space-y-4">
                    {chatMessages.map((msg, i) => (
                      <div
                        key={i}
                        className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                      >
                        <div
                          className={`max-w-[85%] p-4 text-xs leading-relaxed ${
                            msg.sender === 'user'
                              ? 'bg-[#2997FF] text-white rounded-2xl rounded-tr-sm shadow-md'
                              : 'bg-[rgba(255,255,255,0.04)] border border-[rgba(255,255,255,0.08)] text-[#F5F5F7] rounded-2xl rounded-tl-sm'
                          }`}
                        >
                          {msg.queryType && (
                            <div className="mb-2">
                              <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                                msg.queryType === 'recalculate_with_filters' || msg.queryType === 'FILTER_RECALCULATION'
                                  ? 'pill-success'
                                  : msg.queryType === 'unanswerable_by_data' || msg.queryType === 'UNANSWERABLE'
                                  ? 'pill-warning'
                                  : 'pill-accent'
                              }`}>
                                {msg.queryType === 'recalculate_with_filters' || msg.queryType === 'FILTER_RECALCULATION' ? '[In-Memory Recalculation: DuckDB / Pandas]' :
                                 msg.queryType === 'unanswerable_by_data' || msg.queryType === 'UNANSWERABLE' ? '[Notice: Missing Data / Out of Scope]' :
                                 msg.queryType === 'request_new_analysis' || msg.queryType === 'NEW_ANALYSIS_REQUEST' ? '[Notice: New Analysis Required]' :
                                 (health.operating_mode === 'LLM_ENABLED' ? '[Gemini Explanation with Audited Citations]' : '[Deterministic Engine Explanation]')}
                              </span>
                            </div>
                          )}

                          <div className="whitespace-pre-wrap">{msg.text}</div>

                          {/* Provenance Citations */}
                          {msg.citations?.length > 0 && (
                            <div className="mt-3 pt-2.5 border-t border-[rgba(255,255,255,0.08)] text-[11px] space-y-1.5 text-[#A1A1A6]">
                              <span className="font-semibold text-[#2997FF] block">Sources & Provenance:</span>
                              {msg.citations.map((c, idx) => (
                                <div key={idx} className="bg-[rgba(0,0,0,0.3)] p-2 rounded-lg border border-[rgba(255,255,255,0.06)]">
                                  <strong className="text-[#F5F5F7]">{c.source_name}</strong> ({c.source_type})
                                  <div className="text-[10px] text-[#6E6E73] font-mono">Condition: {c.filter_or_condition}</div>
                                </div>
                              ))}
                            </div>
                          )}

                          {msg.limitation && (
                            <div className="mt-2.5 text-[11px] text-[#FF9F0A] font-semibold bg-[rgba(255,159,10,0.08)] p-2 rounded-lg border border-[rgba(255,159,10,0.2)]">
                              Limitation: {msg.limitation}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    {chatLoading && (
                      <div className="text-xs text-[#6E6E73] italic">Consulting audited analytical results...</div>
                    )}
                  </div>

                  {/* Input Form */}
                  <form
                    onSubmit={e => { e.preventDefault(); handleSendChat(); }}
                    className="flex space-x-3"
                  >
                    <input
                      type="text"
                      value={chatInput}
                      onChange={e => setChatInput(e.target.value)}
                      placeholder="Ask a question or request a recalculation with filters..."
                      className="input-apple flex-1"
                    />
                    <button
                      type="submit"
                      disabled={chatLoading || !chatInput.trim()}
                      className="btn-apple-primary px-5 py-2 text-xs"
                    >
                      Send
                    </button>
                  </form>
                </div>
              )}

              {/* TAB 9: PROVENANCE CHAIN */}
              {activeTab === 'provenance' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-semibold tracking-tight text-[#F5F5F7]">Provenance Chain & Audit Trail</h2>
                    <p className="text-sm text-[#8E8E93] mt-1">
                      Continuous chain of custody from raw input ingestion to visual presentation.
                    </p>
                  </div>

                  {artifacts.DashboardSpec?.provenance_chain_summary?.length > 0 ? (
                    <div className="space-y-3">
                      {artifacts.DashboardSpec.provenance_chain_summary.map((step, idx) => (
                        <div key={idx} className="glass-card p-4 flex items-start space-x-3.5">
                          <div className="w-6 h-6 rounded-full bg-[rgba(41,151,255,0.15)] text-[#2997FF] text-xs font-semibold flex items-center justify-center flex-shrink-0">
                            {idx + 1}
                          </div>
                          <div className="flex-1 text-xs font-medium text-[#F5F5F7] pt-0.5">
                            {step}
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="glass-card p-12 text-center text-xs text-[#8E8E93]">
                      Execute the workflow to generate the end-to-end provenance chain.
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
