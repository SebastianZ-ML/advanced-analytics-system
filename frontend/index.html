<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Multi-Agent Advanced Analytics Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for TSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset('custom-react', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .badge-info { background-color: #e0f2fe; color: #0369a1; }
    .badge-warning { background-color: #fef3c7; color: #b45309; }
    .badge-blocking { background-color: #fee2e2; color: #b91c1c; }
    .badge-success { background-color: #dcfce7; color: #15803d; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-presets="custom-react">
    const { useState, useEffect, useRef } = React;

    // --- Main Application Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('projects');
      const [health, setHealth] = useState({ is_demo_mode: true, mode_label: 'Loading...', operating_mode: 'DEMO_WITHOUT_LLM' });
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [currentRun, setCurrentRun] = useState(null);
      const [artifacts, setArtifacts] = useState({});
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'assistant',
          text: 'Hello. I am the grounded conversational analytics assistant. You can ask me about decline drivers, request recalculated metrics with custom filters, or inspect data provenance.',
          citations: []
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Fetch health and projects on mount
      useEffect(() => {
        fetch('/api/health')
          .then(r => r.json())
          .then(data => setHealth(data))
          .catch(err => console.error('Error fetching health:', err));

        loadProjects();
      }, []);

      const loadProjects = async () => {
        try {
          const res = await fetch('/api/projects');
          const data = await res.json();
          setProjects(data);
          if (data.length > 0 && !selectedProject) {
            selectProject(data[0].project_id);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const selectProject = async (projectId) => {
        try {
          const res = await fetch(`/api/projects/${projectId}`);
          const data = await res.json();
          setSelectedProject(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleCreateProject = async (e) => {
        e.preventDefault();
        const name = prompt('New project name:');
        if (!name) return;
        const desc = prompt('Description (optional):') || '';
        try {
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description: desc })
          });
          const newProj = await res.json();
          await loadProjects();
          selectProject(newProj.project_id);
        } catch (e) {
          alert('Error creating project: ' + e);
        }
      };

      const handleLoadDemo = async () => {
        if (!selectedProject) return;
        setLoading(true);
        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/load_demo`, { method: 'POST' });
          const data = await res.json();
          alert(`Demo dataset loaded successfully (${data.tables_loaded.length} tables).`);
          await selectProject(selectedProject.project_id);
          setActiveTab('catalog');
        } catch (e) {
          alert('Error loading demo: ' + e);
        } finally {
          setLoading(false);
        }
      };

      const handleStartRun = async (forceError = false) => {
        if (!selectedProject) return;
        setLoading(true);
        setActiveTab('execution');
        try {
          const res = await fetch(`/api/projects/${selectedProject.project_id}/runs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              objective_question: "Sales declined over recent months. I want to understand where the drop is concentrated, what observable factors explain it, and what actions should be investigated.",
              user_clarifications: { metric_definition: 'net_sales', period_cutoff: 'exclude_incomplete_period' },
              force_error_for_test: forceError
            })
          });
          const data = await res.json();
          if (res.ok) {
            setCurrentRun(data);
            await fetchArtifacts(data.run_id);
            await fetchEvents(data.run_id);
            setActiveTab('dashboard');
          } else {
            alert('Pipeline execution failed: ' + (data.detail || JSON.stringify(data)));
          }
        } catch (e) {
          alert('Error starting execution: ' + e);
        } finally {
          setLoading(false);
        }
      };

      const fetchArtifacts = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/artifacts`);
          const data = await res.json();
          setArtifacts(data);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchEvents = async (runId) => {
        try {
          const res = await fetch(`/api/runs/${runId}/events`);
          const data = await res.json();
          setEvents(data);
        } catch (e) {
          console.error(e);
        }
      };

      const handleSendChat = async (presetText) => {
        const query = presetText || chatInput;
        if (!query.trim() || !currentRun) return;

        const userMsg = { sender: 'user', text: query, citations: [] };
        setChatMessages(prev => [...prev, userMsg]);
        if (!presetText) setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project_id: selectedProject.project_id,
              run_id: currentRun.run_id,
              question: query,
              active_filters: {}
            })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: data.answer_text,
            citations: data.citations || [],
            queryType: data.query_type,
            calculationSummary: data.calculation_summary,
            limitation: data.data_limitation_notice
          }]);
        } catch (e) {
          setChatMessages(prev => [...prev, {
            sender: 'assistant',
            text: 'Error contacting assistant: ' + e,
            citations: []
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-8 h-8 rounded bg-indigo-600 flex items-center justify-center font-bold text-white shadow">
                  A
                </div>
                <div>
                  <h1 className="text-base font-semibold tracking-tight">Adaptive Multi-Agent Analytics</h1>
                  <p className="text-xs text-slate-400">Reproducible analytics with quality control and full provenance</p>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                {/* Mode Status Pill */}
                <div className={`flex items-center px-3 py-1 rounded-full text-xs font-semibold shadow-sm border ${
                  health.operating_mode === 'LLM_ENABLED'
                    ? 'bg-emerald-950/80 text-emerald-300 border-emerald-500/50'
                    : 'bg-blue-950/80 text-blue-300 border-blue-500/50'
                }`}>
                  <span className={`w-2 h-2 rounded-full mr-2 ${
                    health.operating_mode === 'LLM_ENABLED'
                      ? 'bg-emerald-400 animate-pulse'
                      : 'bg-blue-400'
                  }`}></span>
                  {health.operating_mode === 'LLM_ENABLED'
                    ? `[Active: Gemini ${health.gemini_model || 'gemini-3.5-flash'}]`
                    : '[Demo: Deterministic Engine]'}
                </div>

                {/* Project Selector */}
                <div className="flex items-center space-x-2">
                  <select
                    className="bg-slate-800 border border-slate-700 text-xs rounded px-2.5 py-1.5 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    value={selectedProject?.project_id || ''}
                    onChange={e => selectProject(e.target.value)}
                  >
                    {projects.map(p => (
                      <option key={p.project_id} value={p.project_id}>{p.name}</option>
                    ))}
                  </select>
                  <button
                    onClick={handleCreateProject}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1.5 rounded transition shadow"
                  >
                    + New
                  </button>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 bg-slate-950/60 border-t border-slate-800">
              <nav className="flex space-x-1 overflow-x-auto text-xs py-2">
                {[
                  { id: 'projects', label: '1. Projects' },
                  { id: 'catalog', label: '2. Tables & Catalog' },
                  { id: 'objective', label: '3. Objective & Question' },
                  { id: 'quality', label: '4. Quality & Relations' },
                  { id: 'plan', label: '5. Analysis Plan' },
                  { id: 'execution', label: '6. Progress & Audit' },
                  { id: 'dashboard', label: '7. Validated Dashboard' },
                  { id: 'chat', label: '8. Contextual Assistant' },
                  { id: 'provenance', label: '9. Provenance & Audit Trail' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 font-medium rounded-md whitespace-nowrap transition ${
                      activeTab === tab.id
                        ? 'bg-indigo-600 text-white shadow'
                        : 'text-slate-400 hover:text-white hover:bg-slate-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {/* TAB 1: PROJECTS */}
            {activeTab === 'projects' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200 flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Analytics Projects</h2>
                    <p className="text-sm text-slate-500">Manage workspaces, data tables, and reproducible runs.</p>
                  </div>
                  <div className="space-x-3">
                    <button
                      onClick={handleLoadDemo}
                      disabled={loading || !selectedProject}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded shadow transition disabled:opacity-50"
                    >
                      {loading ? 'Loading...' : '[Load Demo Tables]'}
                    </button>
                    <button
                      onClick={() => handleStartRun(false)}
                      disabled={loading || !selectedProject || !selectedProject.files?.length}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded shadow transition disabled:opacity-50"
                    >
                      [Run Complete Analytical Workflow]
                    </button>
                  </div>
                </div>

                {selectedProject && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                      <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Active Project</h3>
                      <p className="text-base font-bold text-slate-900">{selectedProject.name}</p>
                      <p className="text-xs text-slate-500 mt-1">{selectedProject.description || 'No description provided'}</p>
                      <div className="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-400">
                        ID: <code className="text-slate-600">{selectedProject.project_id}</code>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200 md:col-span-2">
                      <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">
                        Registered Tables ({selectedProject.files?.length || 0})
                      </h3>
                      {!selectedProject.files?.length ? (
                        <div className="text-center py-6 text-sm text-slate-400">
                          No tables loaded in this project yet. Click "[Load Demo Tables]" to begin.
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs text-left">
                            <thead className="bg-slate-50 text-slate-600 uppercase border-b border-slate-200">
                              <tr>
                                <th className="py-2 px-3">Table</th>
                                <th className="py-2 px-3">Source File</th>
                                <th className="py-2 px-3">Sheet</th>
                                <th className="py-2 px-3">Rows</th>
                                <th className="py-2 px-3">Columns</th>
                                <th className="py-2 px-3">SHA-256 Hash</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {selectedProject.files.map(f => (
                                <tr key={f.file_id} className="hover:bg-slate-50/50">
                                  <td className="py-2 px-3 font-semibold text-indigo-700">{f.table_name}</td>
                                  <td className="py-2 px-3 text-slate-600">{f.filename}</td>
                                  <td className="py-2 px-3 text-slate-500">{f.sheet_name || '-'}</td>
                                  <td className="py-2 px-3 text-slate-700">{f.row_count.toLocaleString()}</td>
                                  <td className="py-2 px-3 text-slate-700">{f.column_count}</td>
                                  <td className="py-2 px-3 font-mono text-[10px] text-slate-400">{f.file_hash.slice(0, 10)}...</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: CATALOG & PROFILING */}
            {activeTab === 'catalog' && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                  <h2 className="text-base font-bold text-slate-900 mb-1">Data Catalog & Column Profiling</h2>
                  <p className="text-xs text-slate-500">
                    Deterministic inspection of data types, null percentages, and leading zero preservation.
                  </p>
                </div>

                {artifacts.DataCatalog?.tables ? (
                  Object.entries(artifacts.DataCatalog.tables).map(([tblId, tbl]) => (
                    <div key={tblId} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                      <div className="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                        <div>
                          <span className="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded mr-2">
                            {tblId}
                          </span>
                          <span className="text-xs text-slate-500">({tbl.source_filename} {tbl.sheet_name ? `> Sheet: ${tbl.sheet_name}` : ''})</span>
                          <p className="text-xs text-slate-600 mt-1 italic">{tbl.row_semantic_meaning}</p>
                        </div>
                        <div className="text-right text-xs text-slate-500">
                          <div><strong>{tbl.row_count.toLocaleString()}</strong> rows | <strong>{tbl.column_count}</strong> columns</div>
                          <div className="font-mono text-[10px] text-slate-400 mt-0.5">SHA: {tbl.file_hash_sha256.slice(0, 12)}...</div>
                        </div>
                      </div>

                      <div className="p-4 overflow-x-auto">
                        <table className="w-full text-xs text-left">
                          <thead className="bg-slate-100 text-slate-600 uppercase border-b border-slate-200">
                            <tr>
                              <th className="py-2 px-3">Column</th>
                              <th className="py-2 px-3">Inferred Type</th>
                              <th className="py-2 px-3">Nulls (%)</th>
                              <th className="py-2 px-3">Unique</th>
                              <th className="py-2 px-3">Leading Zeros</th>
                              <th className="py-2 px-3">Sample Values</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {Object.entries(tbl.columns).map(([colName, c]) => (
                              <tr key={colName} className="hover:bg-slate-50/50">
                                <td className="py-2 px-3 font-medium text-slate-800">{colName}</td>
                                <td className="py-2 px-3">
                                  <span className="px-2 py-0.5 rounded text-[11px] font-mono bg-slate-100 text-slate-700 border border-slate-200">
                                    {c.inferred_type}
                                  </span>
                                </td>
                                <td className="py-2 px-3">
                                  <span className={c.null_percentage > 0 ? 'text-amber-600 font-semibold' : 'text-slate-400'}>
                                    {c.null_percentage}% ({c.null_count})
                                  </span>
                                </td>
                                <td className="py-2 px-3 text-slate-600">{c.unique_count}</td>
                                <td className="py-2 px-3">
                                  {c.has_leading_zeros ? (
                                    <span className="badge-info px-2 py-0.5 rounded text-[10px] font-bold">Preserved (Text)</span>
                                  ) : (
                                    <span className="text-slate-300">-</span>
                                  )}
                                </td>
                                <td className="py-2 px-3 text-slate-500 font-mono text-[11px]">
                                  {c.sample_values?.slice(0, 3).join(', ') || '-'}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))
                ) : (
                  <div className="bg-white p-8 text-center rounded-lg border border-slate-200 text-sm text-slate-500">
                    Run the pipeline for the Auditor Agent to generate the catalog and profiling report.
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: OBJECTIVE */}
            {activeTab === 'objective' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-1 rounded">
                          Organizer Agent • ObjectiveSpec
                        </span>
                        <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${
                          health.operating_mode === 'LLM_ENABLED'
                            ? 'bg-purple-50 text-purple-700 border-purple-200'
                            : 'bg-blue-50 text-blue-700 border-blue-200'
                        }`}>
                          {health.operating_mode === 'LLM_ENABLED' ? '[Proposed with Gemini Assistance]' : '[Deterministic Rules Engine]'}
                        </span>
                      </div>
                      <h2 className="text-lg font-bold text-slate-900 mt-2">
                        {artifacts.ObjectiveSpec?.original_question || 'Sales declined over recent months...'}
                      </h2>
                    </div>
                    <span className="badge-success px-3 py-1 rounded-full text-xs font-semibold">
                      Status: {artifacts.ObjectiveSpec?.status || 'Draft'}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div className="space-y-4">
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Operational Objective</h4>
                        <p className="text-sm text-slate-800 mt-1 font-medium">{artifacts.ObjectiveSpec?.operational_objective}</p>
                      </div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Decision to Inform</h4>
                        <p className="text-sm text-slate-800 mt-1">{artifacts.ObjectiveSpec?.decision_to_inform}</p>
                      </div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Primary Metric</h4>
                        <span className="inline-block mt-1 px-2.5 py-1 rounded bg-indigo-50 text-indigo-700 font-mono text-xs font-bold">
                          {artifacts.ObjectiveSpec?.primary_metric}
                        </span>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Comparison Period</h4>
                        <p className="text-sm text-slate-800 mt-1 font-medium">{artifacts.ObjectiveSpec?.comparison_period}</p>
                      </div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Acceptance Criteria</h4>
                        <ul className="text-xs text-slate-600 mt-1 list-disc list-inside space-y-1">
                          {artifacts.ObjectiveSpec?.acceptance_criteria?.map((c, idx) => (
                            <li key={idx}>{c}</li>
                          ))}
                        </ul>
                      </div>
                      <div>
                        <h4 className="text-xs font-semibold text-slate-500 uppercase">Excluded Scope</h4>
                        <ul className="text-xs text-slate-500 mt-1 list-disc list-inside space-y-1 italic">
                          {artifacts.ObjectiveSpec?.excluded_scope?.map((s, idx) => (
                            <li key={idx}>{s}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>

                  {/* Ambiguities */}
                  {artifacts.ObjectiveSpec?.pending_ambiguities?.length > 0 && (
                    <div className="mt-6 pt-6 border-t border-slate-100">
                      <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">
                        Semantic Ambiguity Resolutions
                      </h4>
                      <div className="space-y-3">
                        {artifacts.ObjectiveSpec.pending_ambiguities.map(amb => (
                          <div key={amb.id} className="p-3 rounded-lg border border-slate-200 bg-slate-50 flex justify-between items-center">
                            <div>
                              <p className="text-xs font-bold text-slate-800">{amb.question}</p>
                              <p className="text-xs text-slate-500 mt-0.5">{amb.context}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-[11px] font-medium text-indigo-700 bg-indigo-100 px-2.5 py-1 rounded">
                                Resolution: {amb.user_decision || amb.proposed_default}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: QUALITY & RELATIONSHIPS */}
            {activeTab === 'quality' && (
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                  <h2 className="text-base font-bold text-slate-900 mb-1">Data Quality Report (DataQualityReport)</h2>
                  <p className="text-xs text-slate-500">
                    Deterministically audited anomalies with empirical evidence and applied mitigations.
                  </p>
                </div>

                {artifacts.DataQualityReport?.issues?.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {artifacts.DataQualityReport.issues.map(iss => (
                      <div key={iss.id} className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded badge-${iss.severity}`}>

                        <div className="w-7 h-7 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold flex items-center justify-center border border-indigo-200">
                          {idx + 1}
                        </div>
                        <div className="flex-1">
                          <p className="text-xs font-semibold text-slate-900">{step}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="bg-white p-8 text-center rounded-lg border border-slate-200 text-sm text-slate-500">
                    Run the pipeline to generate the complete provenance chain.
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            Adaptive Multi-Agent Analytics Platform • Modular architecture with typed Pydantic contracts and DuckDB
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
